# Run the workspace. Build first with build.ps1 / build.sh: they compute the
# image tag from the exact source commits and write it to .env as XCLD_TAG.
# Or run the prebuilt image instead (see README): put these in .env, then pull:
#   XCLD_IMAGE=ghcr.io/hack4impact/xcld-collab
#   XCLD_TAG=latest                 # or a full <ours7>-<exc7>-<m2e7>-<mcp7> tag
#
#   docker compose up -d --wait     # start the canvas; returns once the healthcheck passes
#   docker compose down             # stop; boards stay on disk
#
# Optional overrides in .env (or your shell):
#   XCLD_PORT=3100                  # host port, always bound to 127.0.0.1
#   XCLD_MCP_PORT=3001              # host port for the chat widget service (widget profile only)
#   XCLD_CONTAINER=xcld-collab      # canvas container name; override for parallel smokes
#   XCLD_MCP_CONTAINER=xcld-mcp     # MCP UI service container name
#   XCLD_BOARDS=./boards            # boards folder, relative to this file
#   XCLD_MAX_DEPTH=0                # nested folder limit; 0 is unlimited
#   XCLD_AUTO_EXPORT=snapshot       # off | snapshot | save (also keeps boards/.exports/<path>.mmd)
#   XCLD_DESIGN_RULES=...           # optional default rules CSV path; folder design-rules.csv overrides it
#   XCLD_AUTHOR_NAME=Your Name      # the canvas's default author; the build seeds it from git config user.name
#   XCLD_TIMING=1                   # record per-stage commit timings at GET /api/timings (profiling)
#   XCLD_SLOW_IO_MS=1000            # log and report (GET /api/status slowIo) file operations this slow
#   XCLD_CACHE_DIR=~/.excalidraw    # host folder for `xcld history export` (<cache>/exports/<board>/)
#                                   # and, with XCLD_HISTORY=cache, version history (<cache>/history/).
#                                   # On Linux it must be writable by XCLD_UID (the build creates it as you).
#   XCLD_HISTORY=volume             # advanced: where version history lives, `volume` (the Docker volume
#                                   # xcld-state) or `cache` (<cache>/history/). The build writes the
#                                   # default for your OS once: Linux cache, Windows/macOS volume.
#   XCLD_UID / XCLD_GID             # Linux only; build.sh sets them to your user
#   COMPOSE_PROFILES=widget         # opt in to the EXPERIMENTAL chat widget (service "mcp", below).
#                                   # Off by default: it loads JS from esm.sh and has known font
#                                   # CSP errors (issues #3, #2). Unset = canvas only, zero egress.
name: xcld-collab

services:
  canvas:
    image: ${XCLD_IMAGE:-xcld-collab}:${XCLD_TAG:?XCLD_TAG is not set - run build.ps1 or build.sh first, or see README for the prebuilt image}
    container_name: ${XCLD_CONTAINER:-xcld-collab}
    ports:
      - "127.0.0.1:${XCLD_PORT:-3100}:3100"
    volumes:
      - "${XCLD_BOARDS:-./boards}:/boards"
      # The cache folder, XCLD_CACHE_DIR on the host (default ~/.excalidraw): `xcld history
      # export` writes <cache>/exports/<board>/, and with XCLD_HISTORY=cache the server keeps
      # version history (journal, history, images) in <cache>/history/.
      - "${XCLD_CACHE_DIR:-~/.excalidraw}:/xcld-cache"
      # Version history with XCLD_HISTORY=volume (the Windows/macOS default): Docker Desktop bind
      # mounts make every file operation a slow round trip, see docs/DESIGN.md#performance.
      # Mounted in both modes so one file serves both; it stays empty with XCLD_HISTORY=cache.
      - "xcld-state:/xcld-state"
    user: "${XCLD_UID:-1000}:${XCLD_GID:-1000}"
    environment:
      # The server and `xcld` resolve the history folder from these (tools/storage.mjs):
      # XCLD_HISTORY=cache -> /xcld-cache/history, volume -> XCLD_HISTORY_VOLUME_DIR.
      XCLD_HISTORY: "${XCLD_HISTORY:-volume}"
      XCLD_CACHE_DIR: "/xcld-cache"
      XCLD_HISTORY_VOLUME_DIR: "/xcld-state"
      # Shown by `xcld history export` so the output names the folder as the host sees it.
      XCLD_CACHE_HOST_DIR: "${XCLD_CACHE_DIR:-~/.excalidraw}"
      XCLD_WATCH_POLL_MS: "${XCLD_WATCH_POLL_MS:-1000}"
      XCLD_MAX_DEPTH: "${XCLD_MAX_DEPTH:-0}"
      XCLD_AUTO_EXPORT: "${XCLD_AUTO_EXPORT:-snapshot}"
      XCLD_DESIGN_RULES: "${XCLD_DESIGN_RULES:-}"
      XCLD_PUBLIC_URL: "http://127.0.0.1:${XCLD_PORT:-3100}"
      # Default author name for the canvas (seeded by the build from git config user.name).
      XCLD_AUTHOR_NAME: "${XCLD_AUTHOR_NAME:-}"
      # 1 = record per-stage commit timings (GET /api/timings); off by default.
      XCLD_TIMING: "${XCLD_TIMING:-}"
      # A commit-pipeline file operation this slow (ms) is logged and listed in /api/status; default 1000.
      XCLD_SLOW_IO_MS: "${XCLD_SLOW_IO_MS:-}"
    restart: unless-stopped

  # EXPERIMENTAL, opt-in: the upstream Excalidraw MCP Apps chat widget. Only starts with
  # COMPOSE_PROFILES=widget; the widget loads React/Excalidraw from https://esm.sh (#3).
  mcp:
    profiles: ["widget"]
    image: ${XCLD_IMAGE:-xcld-collab}:${XCLD_TAG:?XCLD_TAG is not set - run build.ps1 or build.sh first, or see README for the prebuilt image}
    container_name: ${XCLD_MCP_CONTAINER:-xcld-mcp}
    entrypoint: ["node", "/opt/xcld-collab/excalidraw-mcp/dist/index.js"]
    ports:
      - "127.0.0.1:${XCLD_MCP_PORT:-3001}:3001"
    volumes:
      - "${XCLD_BOARDS:-./boards}:/boards"
    user: "${XCLD_UID:-1000}:${XCLD_GID:-1000}"
    environment:
      PORT: "3001"
      TMPDIR: "/boards/.xcld/mcp-checkpoints"
      # Fonts for the widget come from the canvas container (CORS-enabled /excalidraw-assets/).
      XCLD_ASSET_ORIGIN: "http://127.0.0.1:${XCLD_PORT:-3100}"
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('node:net');const s=net.connect(3001,'127.0.0.1',()=>process.exit(0));s.on('error',()=>process.exit(1));s.setTimeout(2000,()=>process.exit(1));"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  # Version history with XCLD_HISTORY=volume (the Windows/macOS default).
  # `docker compose down` keeps it; `docker compose down -v` deletes it, history included.
  xcld-state:
