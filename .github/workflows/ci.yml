# CI for main. Hack4Impact CI-cost rule: automatic runs only on push to main (after
# merge) plus manual dispatch; no pull_request triggers and no required status checks.
#
#   hygiene      every push: gitleaks over main's full history (.gitleaks.toml) and the
#                GitHub-noreply author/committer email check
#   build-test   only when build/app/test inputs changed (or on manual dispatch):
#                build.sh image + vendor tarballs, app build, `node --test tests` (includes
#                the Mermaid checks in tests/mermaid-ci.test.mjs), then a Compose smoke
#                (healthz + `xcld list`)
#   mermaid-latest  manual dispatch on main with `mermaid_latest` only: the latest Mermaid
#                11.x in place of the locked one, then the Mermaid checks. Mermaid isn't
#                pinned; this catches drift before a lockfile update does.
#   load-gate    manual dispatch on main with `load_gate` only: the versions load gate of
#                record (p95 <= 450 ms at 50 and 1,500 elements, plain and --mermaid) on a
#                clean Linux runner. About 16 runner minutes; never on push or pull requests.
#                Run it with: gh workflow run ci.yml --ref main -f load_gate=true
#   concurrency-long  manual dispatch on main with `concurrency_seeds` > 0 only: the concurrency
#                acceptance test (tests/concurrency.mjs) over that many seeds, each run twice, plus
#                a tenth of them with every agent write answering `queued`. The default suite
#                already runs 50 seeds. About 2 runner minutes per 100 seeds after the app build.
#                Run it with: gh workflow run ci.yml --ref main -f concurrency_seeds=1000
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mermaid_latest:
        description: "Only run the Mermaid checks against the latest Mermaid 11.x"
        type: boolean
        default: false
      load_gate:
        description: "Only run the versions load gate (the gate of record, about 16 minutes)"
        type: boolean
        default: false
      concurrency_seeds:
        description: "Only run the concurrency acceptance test with this many seeds (0: off)"
        type: number
        default: 0

permissions: {}

concurrency:
  # The load gate gets its own group, so a push to main doesn't cancel it halfway.
  group: ci-${{ github.ref }}${{ inputs.load_gate && '-load-gate' || '' }}${{ inputs.concurrency_seeds > 0 && '-concurrency' || '' }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: History hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # last successful CI run, for the build decision
    outputs:
      build: ${{ steps.changes.outputs.build }}
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # Every commit reachable from main. Other refs (archive tags, WIP branches) are
      # not part of main and are left out on purpose.
      - name: gitleaks (full history of main)
        run: >-
          "$RUNNER_TEMP/gitleaks" git
          --config .gitleaks.toml
          --log-opts="--full-history HEAD"
          --redact --no-banner --verbose .

      - name: Commit emails are GitHub noreply
        run: ./scripts/check-commit-emails.sh HEAD

      # Compare with the last successful CI run on main, not just this push's "before":
      # a run cancelled by a newer push must not let its changes skip the build.
      - name: Decide whether to build
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          base=""
          if [ "$EVENT" = push ]; then
            base="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)"
          fi
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
            printf 'changed since last successful run (%s):\n%s\n' "${base:0:7}" "$changed"
            if ! grep -Eq '^(app/|tools/|tests/|patches/|scripts/(fetch-at-sha|with-registry)\.sh$|Dockerfile$|\.dockerignore$|build\.sh$|compose\.yaml$|pins\.json$|LICENSE$|NOTICE$|\.github/workflows/ci\.yml$)' <<<"$changed"; then
              build=false
            fi
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  build-test:
    name: Build, test, smoke
    needs: hygiene
    if: needs.hygiene.outputs.build == 'true' && !inputs.mermaid_latest && !inputs.load_gate && !(inputs.concurrency_seeds > 0)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # app/package-lock.json pins the app (npm ci); its vendor entries come from the
      # freshly built vendor tarballs. Cache npm's download cache on the lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # Runtime image first, from a pristine tree, so the tag is never -dirty. The
      # vendor export afterwards reuses the same BuildKit cache and takes seconds.
      # No registry is configured, so both builds use public npm.
      - name: build.sh (runtime image)
        run: ./build.sh

      - name: build.sh --target vendor
        run: ./build.sh --target vendor

      - name: App install and build
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Tests
        run: node --test tests

      - name: Compose smoke
        run: |
          docker compose up -d --wait --wait-timeout 120
          code="$(curl -sS --retry 5 --retry-connrefused --retry-delay 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/healthz)"
          echo "healthz: $code"
          [ "$code" = 200 ]
          docker exec xcld-collab xcld list

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Compose down
        if: always()
        run: docker compose down || true

  # Manual, main only: is the newest Mermaid 11.x still compatible with the parser bundle's
  # FlowDB patch and the parse output server-side apply relies on? (Mermaid isn't pinned.)
  mermaid-latest:
    name: Mermaid checks on the latest Mermaid 11.x
    needs: hygiene
    if: github.event_name == 'workflow_dispatch' && inputs.mermaid_latest && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # npm ci needs the vendor tarballs the lockfile points at.
      - name: build.sh --target vendor
        run: ./build.sh --target vendor

      - name: App install, then the latest Mermaid 11.x in place of the locked one
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund mermaid@11
          node -e "console.log('mermaid ' + JSON.parse(require('fs').readFileSync('node_modules/mermaid/package.json', 'utf8')).version)"
          npm run build:mermaid

      - name: Mermaid checks
        run: node --test tests/mermaid-ci.test.mjs tests/mermaid-parse.test.mjs tests/mermaid-apply.test.mjs

  # Manual, main only: the concurrency acceptance test in long mode (tests/concurrency.mjs). Needs
  # the app build for the Mermaid parser bundle; no image, no Compose.
  concurrency-long:
    name: Concurrency acceptance (long mode)
    needs: hygiene
    if: github.event_name == 'workflow_dispatch' && inputs.concurrency_seeds > 0 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SEEDS: ${{ inputs.concurrency_seeds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # npm ci needs the vendor tarballs the lockfile points at.
      - name: build.sh --target vendor
        run: ./build.sh --target vendor

      - name: App install and build (Mermaid parser bundle)
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Concurrency, ${{ inputs.concurrency_seeds }} seeds
        run: |
          set -o pipefail
          node tests/concurrency.mjs --seeds "$SEEDS" --parallel 4 2>&1 | tee concurrency.txt

      - name: Concurrency, every agent write queued
        run: |
          set -o pipefail
          queued=$(( SEEDS / 10 > 5 ? SEEDS / 10 : 5 ))
          node tests/concurrency.mjs --start 100001 --seeds "$queued" --wait-ms 1 --parallel 4 2>&1 | tee concurrency-queued.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Concurrency acceptance (long mode)"
            for file in concurrency.txt concurrency-queued.txt; do
              [ -f "$file" ] || continue
              echo
              echo '```text'
              grep -E '^concurrency:' "$file" || tail -n 20 "$file"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: concurrency-${{ github.run_id }}
          path: |
            concurrency*.txt
            .test-run/
          if-no-files-found: warn
          retention-days: 14

  # Manual, main only: the versions load gate of record (docs/DESIGN.md#performance). Builds the
  # image, starts it with XCLD_TIMING=1 on scratch boards and history folders, and runs
  # tests/versions-load.mjs plain and --mermaid at 50 and 1,500 elements (2 min and at least 300
  # writes each) with --gate 450. Estimate: build about 5 min, the four runs about 9-10 min, setup
  # and teardown about 1 min: about 16 runner minutes.
  load-gate:
    name: Load gate (gate of record)
    needs: hygiene
    if: github.event_name == 'workflow_dispatch' && inputs.load_gate && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      XCLD_TIMING: "1"
      XCLD_PORT: "3100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: build.sh (runtime image)
        run: ./build.sh

      # Scratch boards and history (XCLD_HISTORY=cache, the Linux default, so history is on the
      # runner's disk), created as the runner user that build.sh wrote to .env as XCLD_UID.
      - name: Start the workspace (XCLD_TIMING=1, scratch folders)
        run: |
          mkdir -p "$RUNNER_TEMP/boards" "$RUNNER_TEMP/cache/history" "$RUNNER_TEMP/cache/exports" load-gate
          {
            echo "XCLD_BOARDS=$RUNNER_TEMP/boards"
            echo "XCLD_CACHE_DIR=$RUNNER_TEMP/cache"
            echo "XCLD_HISTORY=cache"
          } >> "$GITHUB_ENV"
          export XCLD_BOARDS="$RUNNER_TEMP/boards" XCLD_CACHE_DIR="$RUNNER_TEMP/cache" XCLD_HISTORY=cache
          docker compose up -d --wait --wait-timeout 120
          curl -fsS --retry 5 --retry-connrefused --retry-delay 2 http://127.0.0.1:3100/api/config
          echo
          nproc; free -m; df -h "$RUNNER_TEMP"

      # Both scenarios always run; the job fails afterwards if either missed the gate.
      - name: Load gate, plain
        id: plain
        continue-on-error: true
        run: |
          set -o pipefail
          node tests/versions-load.mjs --url http://127.0.0.1:3100 --sizes 50,1500 --gate 450 \
            --json load-gate/plain.json 2>&1 | tee load-gate/plain.txt

      - name: Load gate, --mermaid
        id: mermaid
        continue-on-error: true
        run: |
          set -o pipefail
          node tests/versions-load.mjs --url http://127.0.0.1:3100 --sizes 50,1500 --gate 450 --mermaid \
            --json load-gate/mermaid.json 2>&1 | tee load-gate/mermaid.txt

      - name: Slow-I/O summary and job summary
        if: always()
        env:
          PLAIN: ${{ steps.plain.outcome }}
          MERMAID: ${{ steps.mermaid.outcome }}
        run: |
          curl -fsS http://127.0.0.1:3100/api/status > load-gate/status.json || echo '{}' > load-gate/status.json
          echo "Slow file-system operations since the server started (GET /api/status slowIo):"
          jq '.slowIo | {thresholdMs, count, maxMs, byStage, inFlight}' load-gate/status.json || true
          {
            echo "## Versions load gate (gate of record)"
            echo
            echo "Plain: $PLAIN; --mermaid: $MERMAID"
            for mode in plain mermaid; do
              [ -f "load-gate/$mode.txt" ] || continue
              echo
              echo "### $mode"
              echo
              echo '```text'
              cat "load-gate/$mode.txt"
              echo '```'
            done
            echo
            echo "### Slow I/O since start"
            echo
            echo '```json'
            jq '.slowIo' load-gate/status.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compose logs
        if: always()
        run: docker compose logs --no-color --tail 400 > load-gate/compose.log 2>&1 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: load-gate-${{ github.run_id }}
          path: load-gate/
          if-no-files-found: warn
          retention-days: 30

      - name: Compose down
        if: always()
        run: docker compose down -v || true

      - name: Fail when the gate failed
        if: steps.plain.outcome != 'success' || steps.mermaid.outcome != 'success'
        env:
          PLAIN: ${{ steps.plain.outcome }}
          MERMAID: ${{ steps.mermaid.outcome }}
        run: |
          echo "::error::Load gate failed (plain: $PLAIN, --mermaid: $MERMAID); see the job summary and the load-gate artifact."
          exit 1
